name: Build USB Host

on:
  push:
  pull_request:

jobs:
  build-usbhost:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build ESP32-S3 USB Host
        run: |
          pio run -e esp32s3-usbhost
