name: Build USB Host

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-usbhost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ESP32-S3 USB Host
        run: |
          pio run -e esp32s3-usbhost

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-usbhost
          retention-days: 30
          path: |
            .pio/build/esp32s3-usbhost/*.bin
            .pio/build/esp32s3-usbhost/*.elf
            .pio/build/esp32s3-usbhost/*.map
